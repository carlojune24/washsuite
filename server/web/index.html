<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WashSuite Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234647ae'/%3E%3Cstop offset='1' stop-color='%234382df'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='17' r='8' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='17' r='3.4' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='10.5' cy='9.5' r='1.3' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --brand-900: #112e81;
    --brand-600: #4647ae;
    --brand-500: #4382df;
    --brand-200: #aaccd6;
    --page: #f4f6fb;
    --surface: #ffffff;
    --surface-muted: #f4f6fb;
    --ink: #112e81;
    --ink-rgb: 17, 46, 129;
    --emerald-100: #d1fae5; --emerald-600: #059669; --emerald-700: #047857;
    --amber-100: #fef3c7;   --amber-600: #d97706;   --amber-700: #b45309;
    --red-100: #fee2e2;     --red-600: #dc2626;
    --blue-100: #dbeafe;    --blue-600: #2563eb;
    --sky-100: #e0f2fe;     --sky-600: #0284c7;
    --gray-100: #f3f4f6;    --gray-500: #6b7280;
    --shadow-sm: 0 1px 2px rgba(var(--ink-rgb), .05), 0 2px 8px rgba(var(--ink-rgb), .06);
    --shadow-md: 0 4px 16px rgba(var(--ink-rgb), .10), 0 1px 3px rgba(var(--ink-rgb), .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand-600: #4a52b0; --brand-500: #3a72c8; --brand-200: #22384a;
      --page: #10141f; --surface: #1a2233; --surface-muted: #232c40;
      --ink: #e8ecf9; --ink-rgb: 232, 236, 249;
      --emerald-100: #064e3b; --emerald-600: #34d399; --emerald-700: #6ee7b7;
      --amber-100: #78350f;   --amber-600: #fbbf24;   --amber-700: #fcd34d;
      --red-100: #7f1d1d;     --red-600: #f87171;
      --blue-100: #1e3a8a;    --blue-600: #60a5fa;
      --sky-100: #0c4a6e;     --sky-600: #38bdf8;
      --gray-100: #232c40;    --gray-500: #9aa5c3;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .22), 0 2px 10px rgba(0, 0, 0, .28);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, .34), 0 1px 3px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; }
  /* overflow-x: hidden guards against the landing page's full-bleed .lp-wall (width: 100vw)
     overshooting the real viewport -- 100vw includes the vertical scrollbar's own width on
     Windows/Linux browsers, while the page's actual visible area (clientWidth) doesn't, so
     without this the wall extends a few pixels past the right edge and adds a horizontal
     scrollbar. */
  html, body { height: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 960px; margin: 0 auto; padding: 28px 20px 72px; }

  /* ---- shared atoms ---- */
  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sm); padding: 18px; }
  .muted { color: rgba(var(--ink-rgb), .5); }
  .muted-strong { color: rgba(var(--ink-rgb), .65); }
  h2.section {
    font-size: 13px; font-weight: 700; margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon-lg { width: 22px; height: 22px; }

  .chip {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 11px;
  }
  .chip.sm { width: 28px; height: 28px; border-radius: 9px; }
  .chip svg { width: 16px; height: 16px; }
  .chip.emerald { background: var(--emerald-100); color: var(--emerald-600); }
  .chip.amber   { background: var(--amber-100);   color: var(--amber-600); }
  .chip.red     { background: var(--red-100);     color: var(--red-600); }
  .chip.blue    { background: var(--blue-100);    color: var(--blue-600); }
  .chip.sky     { background: var(--sky-100);     color: var(--sky-600); }
  .chip.gray    { background: var(--gray-100);    color: var(--gray-500); }
  .chip.brand   { background: linear-gradient(135deg, var(--brand-600), var(--brand-500)); color: #fff; }

  .pill { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .pill.up      { background: rgba(16, 185, 129, .16); color: var(--emerald-600); }
  .pill.down    { background: rgba(220, 38, 38, .14);  color: var(--red-600); }
  .pill svg { width: 10px; height: 10px; }

  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .status-pill.present, .status-pill.running { background: var(--emerald-100); color: var(--emerald-700); }
  .status-pill.late                          { background: var(--amber-100);   color: var(--amber-700); }
  .status-pill.absent, .status-pill.offline  { background: var(--red-100);     color: var(--red-600); }
  .status-pill.idle, .status-pill.not_clocked_in, .status-pill.leave, .status-pill.half_day {
    background: var(--gray-100); color: var(--gray-500);
  }

  .row { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
  .row + .row { border-top: 1px solid rgba(var(--ink-rgb), .06); }
  .row .name { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; }
  .row .name span.sub { display: block; font-size: 11px; font-weight: 400; color: rgba(var(--ink-rgb), .45); margin-top: 1px; }
  .row .amt { font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--red-600); }
  .row-more { padding: 8px 0 2px; text-align: center; font-size: 11px; color: rgba(var(--ink-rgb), .4); border-top: 1px solid rgba(var(--ink-rgb), .06); }

  .avatar { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }

  .live-dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
  .live-dot.fresh { background: var(--emerald-600); animation: pulse 2s ease-in-out infinite; }
  .live-dot.stale { background: rgba(var(--ink-rgb), .3); }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.72); } }

  /* ---- header ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--brand-600), var(--brand-500)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .brand .mark svg { width: 20px; height: 20px; color: #fff; }
  .brand .word { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
  .brand .word small { display: block; font-size: 10.5px; font-weight: 600; color: rgba(var(--ink-rgb), .45); letter-spacing: .02em; }

  .meta { display: flex; align-items: center; gap: 12px; }
  .meta .updated { text-align: right; font-size: 11.5px; }
  .meta .updated .flex { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .btn-refresh {
    display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: none;
    background: var(--surface); color: var(--brand-500); font-weight: 700; font-size: 12.5px; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-refresh:hover { box-shadow: var(--shadow-md); }
  .btn-refresh:active { transform: scale(.96); }
  .btn-refresh svg { width: 14px; height: 14px; transition: transform .5s cubic-bezier(.16, 1, .3, 1); }
  .btn-refresh.spinning svg { transform: rotate(360deg); }
  .btn-refresh:disabled { opacity: .55; cursor: default; }

  .meta-actions { display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--surface); color: rgba(var(--ink-rgb), .45); box-shadow: var(--shadow-sm);
    transition: box-shadow .15s ease, color .15s ease;
  }
  .btn-icon:hover { box-shadow: var(--shadow-md); color: var(--red-600); }
  .btn-icon svg { width: 15px; height: 15px; }

  .date-picker {
    width: auto; padding: 8px 12px; border-radius: 999px; border: none;
    background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 700;
    box-shadow: var(--shadow-sm); cursor: pointer;
  }
  .date-picker:focus { border-color: transparent; }
  .btn-live {
    display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: none;
    background: var(--brand-500); color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer;
    box-shadow: var(--shadow-sm);
  }

  .toast-host {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
    display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
    width: min(360px, calc(100vw - 32px));
  }
  .toast {
    pointer-events: auto; width: 100%; padding: 12px 16px; border-radius: 14px;
    background: var(--ink); color: var(--page); font-size: 12.5px; font-weight: 600; line-height: 1.45;
    box-shadow: var(--shadow-md); text-align: center; opacity: 0; transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ---- hero (dashboard) ---- */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 24px; color: #fff; background: linear-gradient(135deg, var(--brand-600), var(--brand-500)); box-shadow: var(--shadow-md); margin-bottom: 14px; }
  .hero .watermark { position: absolute; right: -14px; bottom: -18px; width: 130px; height: 130px; color: rgba(255, 255, 255, .1); pointer-events: none; }
  .hero .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(255, 255, 255, .78); font-weight: 600; margin-bottom: 10px; }
  .hero .eyebrow .chip { width: 26px; height: 26px; border-radius: 9px; background: rgba(255, 255, 255, .16); color: #fff; }
  .hero .eyebrow .chip svg { width: 14px; height: 14px; }
  .hero .figure { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; position: relative; }
  .hero .sub { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: rgba(255, 255, 255, .7); position: relative; }
  .hero .pill.up   { background: rgba(255, 255, 255, .2); color: #d7ffe9; }
  .hero .pill.down { background: rgba(255, 255, 255, .2); color: #ffd9d9; }

  /* ---- grids ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card { border-radius: 18px; padding: 14px; box-shadow: var(--shadow-sm); }
  .stat-card.surface { background: var(--surface); }
  .stat-card.accent { background: linear-gradient(135deg, var(--brand-600), var(--brand-500)); color: #fff; }
  .stat-card .chip { margin-bottom: 10px; }
  .stat-card .value { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .stat-card .label { font-size: 11px; margin-top: 1px; }
  .stat-card.accent .label { color: rgba(255, 255, 255, .75); }
  .stat-card.surface .label { color: rgba(var(--ink-rgb), .5); }

  /* The ₱ glyph's crossbar sits close enough to full-size digits that some system fonts
     render it as a visual strikethrough into the following number -- sizing it down (a
     common currency-mark convention anyway) removes the overlap entirely. */
  .cur { font-size: .64em; font-weight: 700; margin-right: 1px; }

  .detail-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 860px) { .detail-grid { grid-template-columns: 1fr 1fr; } }
  .detail-grid .card { margin-bottom: 0; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  .method-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 4px; }
  .method-grid .item { display: flex; align-items: center; gap: 9px; }
  .method-grid .amt { font-size: 13px; font-weight: 700; }
  .method-grid .lbl { font-size: 10.5px; color: rgba(var(--ink-rgb), .48); }

  .cf-rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .cf-rows .item { text-align: left; }
  .cf-rows .amt { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .cf-rows .lbl { font-size: 10.5px; color: rgba(var(--ink-rgb), .48); margin-top: 1px; }

  .empty-row { padding: 14px 0; text-align: center; font-size: 12.5px; color: rgba(var(--ink-rgb), .4); }

  /* ---- login ---- */
  .login-wrap { max-width: 360px; margin: 12vh auto 0; }
  .login-card { text-align: center; }
  .login-card .brand { justify-content: center; margin-bottom: 22px; }
  .login-card .mark { width: 44px; height: 44px; border-radius: 14px; }
  .login-card .mark svg { width: 24px; height: 24px; }
  .login-card .word { font-size: 17px; text-align: left; }
  label.field { display: block; text-align: left; margin-bottom: 14px; }
  label.field span { display: block; font-size: 12px; font-weight: 600; color: rgba(var(--ink-rgb), .55); margin-bottom: 5px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid transparent;
    background: var(--surface-muted); color: var(--ink); font-size: 14px; font-weight: 500;
    outline: none; transition: border-color .15s ease;
  }
  input:focus { border-color: var(--brand-500); }
  button.primary {
    width: 100%; padding: 13px; border-radius: 14px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--brand-600), var(--brand-500)); color: #fff;
    font-size: 14px; font-weight: 700; box-shadow: var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button.primary:hover { box-shadow: var(--shadow-md); }
  button.primary:active { transform: scale(.98); }
  button.primary:disabled { opacity: .6; cursor: default; transform: none; }
  .err { color: var(--red-600); font-size: 12.5px; margin: -6px 0 14px; text-align: left; }
  .login-hint { text-align: center; font-size: 11.5px; color: rgba(var(--ink-rgb), .4); margin-top: 16px; line-height: 1.5; }

  .fade-in { animation: fadeIn .45s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  a.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(var(--ink-rgb), .48); text-decoration: none; margin-bottom: 18px; }
  a.back-link:hover { color: var(--ink); }
  a.back-link svg { width: 12px; height: 12px; }

  /* ================= Landing page ================= */
  /* Committed dark register regardless of OS light/dark preference -- a deliberate marketing
     surface, distinct from the theme-adaptive dashboard/login above. Namespaced tokens so they
     never leak into (or get overridden by) the :root light/dark pair. */
  body.lp-body {
    --lp-bg: #10141c;
    --lp-surface: #171e2c;
    --lp-surface-2: #1e273a;
    --lp-border: rgba(255,255,255,.08);
    --lp-ink: #eef1fa;
    --lp-ink-rgb: 238,241,250;
    --lp-muted: rgba(238,241,250,.64);
    --lp-faint: rgba(238,241,250,.42);
    --lp-accent: #5b8def;
    --lp-accent-ink: #dbe7ff;
    --lp-green: #34d399;
    background: var(--lp-bg);
  }
  .lp-wall {
    margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); width: 100vw;
    background: var(--lp-bg); color: var(--lp-ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .lp-container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  .lp-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; max-width: 1180px; margin: 0 auto; }
  .lp-mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--lp-ink); flex-shrink: 0; }
  .lp-mark .chip-mark { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; background: linear-gradient(135deg, var(--brand-600), var(--brand-500)); display: flex; align-items: center; justify-content: center; }
  .lp-mark .chip-mark svg { width: 17px; height: 17px; color: #fff; }
  .lp-mark .word { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
  .lp-nav-links { display: none; align-items: center; gap: 26px; font-size: 13.5px; font-weight: 500; }
  .lp-nav-links a { color: var(--lp-muted); text-decoration: none; }
  .lp-nav-links a:hover { color: var(--lp-ink); }
  @media (min-width: 860px) { .lp-nav-links { display: flex; } }
  .lp-nav-right { display: flex; align-items: center; gap: 10px; }
  .lp-login-link { font-size: 13px; font-weight: 600; color: var(--lp-muted); text-decoration: none; padding: 8px 4px; white-space: nowrap; }
  .lp-login-link:hover { color: var(--lp-ink); }

  .lp-btn {
    font-weight: 700; font-size: 13.5px; text-decoration: none; padding: 11px 20px; border-radius: 10px;
    display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; white-space: nowrap;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .lp-btn svg { width: 14px; height: 14px; }
  .lp-btn-primary { background: var(--lp-accent); color: #08101f; box-shadow: 0 4px 14px -4px rgba(91,141,239,.5); }
  .lp-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px -6px rgba(91,141,239,.6); }
  .lp-btn-ghost { background: var(--lp-surface); color: var(--lp-ink); border: 1px solid var(--lp-border); }
  .lp-btn-ghost:hover { background: var(--lp-surface-2); }

  /* ---- hero ---- */
  .lp-hero { padding: 44px 24px 64px; max-width: 1180px; margin: 0 auto; }
  .lp-hero-grid { display: grid; grid-template-columns: 1fr; gap: 36px; align-items: center; }
  @media (min-width: 940px) { .lp-hero-grid { grid-template-columns: 1.05fr .95fr; gap: 48px; } }
  .lp-eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--lp-accent-ink); margin-bottom: 18px;
  }
  .lp-eyebrow .dot { width: 4px; height: 4px; border-radius: 999px; background: var(--lp-faint); }
  .lp-headline { font-size: clamp(32px, 4.6vw, 50px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; margin: 0 0 18px; }
  .lp-headline .accent { color: var(--lp-accent-ink); }
  .lp-sub { font-size: 16px; line-height: 1.6; color: var(--lp-muted); max-width: 46ch; margin: 0 0 26px; }
  .lp-cta-row { display: flex; flex-wrap: wrap; gap: 12px; }

  .lp-panel {
    background: var(--lp-surface); border: 1px solid var(--lp-border); border-radius: 20px; padding: 22px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.5);
  }
  .lp-panel-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--lp-faint); margin-bottom: 6px; }
  .lp-panel-figure { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
  .lp-panel-delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--lp-green); margin-bottom: 18px; }
  .lp-panel-rows { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--lp-border); }
  .lp-panel-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .lp-panel-row .lbl { color: var(--lp-muted); }
  .lp-panel-row .val { font-weight: 700; }
  .lp-panel-foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--lp-border); display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--lp-faint); }
  .lp-panel-foot .live { display: inline-flex; align-items: center; gap: 6px; }
  .lp-panel-foot .live-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--lp-green); }

  /* ---- section shell ---- */
  .lp-section { padding: 64px 24px; max-width: 1180px; margin: 0 auto; }
  .lp-section-head { max-width: 640px; margin: 0 0 40px; }
  .lp-section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
  .lp-kicker { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lp-accent-ink); margin-bottom: 10px; }
  .lp-section-title { font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; letter-spacing: -0.01em; margin: 0 0 12px; }

<script>

function svg(name, extra) {
  return `<svg class="icon${extra ? " " + extra : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}

const AVATAR_PALETTE = [
  ["#fce7f3", "#db2777"], ["#dbeafe", "#2563eb"], ["#f3e8ff", "#9333ea"],
  ["#fef3c7", "#d97706"], ["#d1fae5", "#059669"], ["#cffafe", "#0891b2"],
];
function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
}

const $ = (sel) => document.querySelector(sel);

// Datepicker state: viewingDate null = live/latest; otherwise the "YYYY-MM-DD" being browsed.
// availableDates is fetched once per session and used only to bound the picker's min/max --
// native <input type=date> can't disable arbitrary individual dates, so gaps within that range
// are handled by the "no data" empty state instead.
let viewingDate = null;
let availableDates = [];
let availableDatesLoaded = false;
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function peso(n) { return `<span class="cur">₱</span>${Number(n ?? 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function pctChange(curr, prev) {
  if (!prev) return null;
  return ((curr - prev) / Math.abs(prev)) * 100;
}
function deltaPill(pct, onDark) {
  if (pct == null) return "";
  const up = pct >= 0;
  return `<span class="pill ${up ? "up" : "down"}">${svg(up ? "arrowUp" : "arrowDown")}${Math.abs(pct).toFixed(0)}%</span>`;
}
function showToast(message, ms = 5000) {
  const host = $("#toastHost");
  if (!host) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, ms);
}
function formatDateLabel(dateStr) {
  if (!dateStr) return "";
  return new Date(`${dateStr}T00:00:00Z`).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
}
function timeOfDay(dt) {
  // Stored as UTC "YYYY-MM-DD HH:MM:SS" by the WashSuite app -- append "Z" to parse it as such,
  // same convention as parseUtcTimestamp() in src/lib/db.ts.
  if (!dt) return "";
  const d = new Date(dt.replace(" ", "T") + "Z");
  return isNaN(d.getTime()) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function timeAgo(iso) {
  if (!iso) return "never synced";
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return "just now";
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function statusLabel(s) {
  return { present: "Present", late: "Late", absent: "Absent", leave: "On leave", half_day: "Half day", not_clocked_in: "Not in", running: "Running", idle: "Idle", offline: "Offline" }[s] ?? s;
}
// time_in/time_out are plain "HH:MM" wall-clock strings (not UTC timestamps) -- same convention
// as formatTime() in src/pages/Attendance.tsx, just reimplemented here since that's React-side.
function clockTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return "";
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${period}`;
}
// Mirrors timeSubtitle() in src/pages/Attendance.tsx so the roster reads the same way here.
function timeSubtitle(r) {
  if (r.status === "absent") return "Absent";
  if (r.status === "leave") return "On leave";
  if (r.time_in && r.time_out) return `${clockTime(r.time_in)} – ${clockTime(r.time_out)}`;
  if (r.time_in) return `Clocked in at ${clockTime(r.time_in)}`;
  return "Not clocked in";
}

async function api(path, opts) {
  const res = await fetch(path, { credentials: "include", headers: { "Content-Type": "application/json" }, ...opts });
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) throw new Error((body && (body.message || body.error)) || ("HTTP " + res.status));
  return body;
}

function brandMark(size) {
  return `<div class="mark">${svg("porthole")}</div><div class="word">WashSuite<small>Monitor</small></div>`;
}

/* ================= Client-side routing =================
   Three addressable screens -- "/" (landing), "/login", "/dashboard" -- each also served as a
   real document by the Rust server (see main.rs) so a bookmark, shared link, or plain refresh on
   any of them works, not just client-side navigation. `navigate()` pushes a real history entry for
   genuine user-initiated moves (nav clicks, login, logout); render functions call `syncUrl()` on
   every call so the address bar always matches what's on screen without spamming history on
   redundant re-renders (e.g. the dashboard's own Refresh button). */
function syncUrl(path) {
  if (location.pathname !== path) history.replaceState(null, "", path);
}
function navigate(path) {
  if (location.pathname !== path) history.pushState(null, "", path);
}
function route() {
  const path = location.pathname;
  if (path === "/dashboard") { loadSnapshot(); return; }
  if (path === "/login") {
    api("/v1/dashboard/snapshot").then((data) => { navigate("/dashboard"); renderDashboard(data); }).catch(() => renderLogin());
    return;
  }
  renderLanding();
}
window.addEventListener("popstate", route);

async function doLogout() {
  try { await api("/v1/dashboard/logout", { method: "POST" }); } catch {}
  viewingDate = null;
  availableDates = [];
  availableDatesLoaded = false;
  navigate("/");
  renderLanding();
}

function renderLogin(err) {
  syncUrl("/login");
  document.body.classList.remove("lp-body");
  const params = new URLSearchParams(location.search);
  $("#app").innerHTML = `
    <div class="login-wrap fade-in">
      <a href="#" id="backToLanding" class="back-link">${svg("chevronLeft")}Back to washsuite.duckdns.org</a>
      <div class="card login-card">
        <div class="brand">${brandMark()}</div>
        <label class="field">
          <span>Shop ID</span>
          <input id="shopId" value="${esc(params.get("shop_id") ?? "")}" placeholder="e.g. 692ec89a-36ae-...">
        </label>
        <label class="field">
          <span>Dashboard password</span>
          <input id="password" type="password" placeholder="••••••••">
        </label>
        ${err ? `<div class="err">${esc(err)}</div>` : ""}
        <button class="primary" id="loginBtn">Log in</button>
      </div>
      <p class="login-hint">Find your Shop ID in WashSuite &rarr; Settings &rarr; Online Monitoring.</p>
    </div>
  `;
  $("#backToLanding").onclick = (e) => { e.preventDefault(); navigate("/"); renderLanding(); };
  const doLogin = async () => {
    const shop_id = $("#shopId").value.trim();
    const password = $("#password").value;
    const btn = $("#loginBtn");
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      await api("/v1/dashboard/login", { method: "POST", body: JSON.stringify({ shop_id, password }) });
      navigate("/dashboard");
      await loadSnapshot();
    } catch (e) {
      renderLogin(e.message === "invalid_credentials" ? "Incorrect Shop ID or password." : e.message);
    }
  };
  $("#loginBtn").onclick = doLogin;
  $("#password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

function renderDashboard(data) {
  syncUrl("/dashboard");
  document.body.classList.remove("lp-body");
  const s = data.snapshot;

  if (!s) {
    const emptyMsg = viewingDate
      ? `No data for ${esc(formatDateLabel(viewingDate))}. Ask your staff to backfill it from Settings &rarr; Online Monitoring in the WashSuite app.`
      : "No data pushed yet. Enable monitoring in WashSuite &mdash; it'll appear here within a minute.";
    if (viewingDate) {
      showToast(`No data for ${formatDateLabel(viewingDate)} — ask your staff to backfill it from Settings → Online Monitoring in the app.`);
    }
    $("#app").innerHTML = `
      <div class="topbar">
        <div class="brand">${brandMark()}</div>
        <div class="meta-actions">
          <input type="date" class="date-picker" id="datePicker" value="${esc(viewingDate ?? "")}" max="${esc(availableDates[0] ?? "")}">
          ${viewingDate ? `<button class="btn-live" id="liveBtn">${svg("refresh")}Today</button>` : ""}
          <button class="btn-icon" id="logoutBtn" title="Log out">${svg("logout")}</button>
        </div>
      </div>
      <div class="card fade-in" style="text-align:center; padding: 40px 20px;">
        <div class="chip brand" style="margin:0 auto 14px;">${svg("gauge")}</div>
        <p style="font-weight:700; margin:0 0 4px;">${esc(data.shop_name ?? "Your shop")}</p>
        <p class="muted" style="font-size:13px; margin:0;">${emptyMsg}</p>
      </div>`;
    $("#logoutBtn").onclick = () => doLogout();
    $("#datePicker").onchange = (e) => { if (e.target.value) loadSnapshot(e.target.value); };
    if (viewingDate) $("#liveBtn").onclick = () => loadSnapshot();
    if (!availableDatesLoaded) loadAvailableDates();
    return;
  }

  const fresh = data.received_at && (Date.now() - new Date(data.received_at).getTime()) < 3 * 60 * 1000;
  const salesDelta = pctChange(s.sales?.today_total ?? 0, s.sales?.yesterday_total ?? 0);

  const machines = s.machines?.machines ?? [];
  const machinesHtml = machines.length
    ? machines.map((m) => `
      <div class="row">
        <div class="chip sm ${m.status === "running" ? "emerald" : m.status === "offline" ? "red" : "gray"}">${svg("porthole")}</div>
        <div class="name">${esc(m.name)}<span class="sub">${m.loads_today} load${m.loads_today === 1 ? "" : "s"} today</span></div>
        <span class="status-pill ${esc(m.status)}">${statusLabel(m.status)}</span>
      </div>`).join("")
    : `<div class="empty-row">No machines registered yet</div>`;

  const EXPENSE_CAP = 8;
  const expenses = s.cashflow?.expenses_today ?? [];
  const expensesHtml = expenses.length
    ? expenses.slice(0, EXPENSE_CAP).map((e) => `
      <div class="row">
        <div class="chip sm red">${svg("receipt")}</div>
        <div class="name">${esc(e.description || "Expense")}<span class="sub">${e.category ? esc(e.category) + " &middot; " : ""}${esc(timeOfDay(e.expense_date))}</span></div>
        <div class="amt">-${peso(e.amount)}</div>
      </div>`).join("") +
      (expenses.length > EXPENSE_CAP ? `<div class="row-more">+${expenses.length - EXPENSE_CAP} more today</div>` : "")
    : `<div class="empty-row">No expenses logged today</div>`;

  const roster = s.attendance?.roster ?? [];
  const rosterHtml = roster.length
    ? roster.slice(0, 10).map((r) => {
        const [bg, fg] = avatarColor(r.full_name);
        return `
      <div class="row">
        <div class="avatar" style="background:${bg}; color:${fg};">${esc(r.full_name.slice(0, 1).toUpperCase())}</div>
        <div class="name">${esc(r.full_name)}<span class="sub">${esc(r.position ?? "Worker")} &middot; ${esc(timeSubtitle(r))}</span></div>
        <span class="status-pill ${esc(r.status)}">${statusLabel(r.status)}</span>
      </div>`;
      }).join("")
    : `<div class="empty-row">No active workers</div>`;

  $("#app").innerHTML = `
    <div class="topbar">
      <div class="brand">${brandMark()}</div>
      <div class="meta">
        <div class="updated">
          <div style="font-weight:700; margin-bottom:2px;">${esc(data.shop_name ?? "Your shop")}</div>
          ${viewingDate
            ? `<div class="flex muted">Viewing ${esc(formatDateLabel(viewingDate))}</div>`
            : `<div class="flex muted"><span class="live-dot ${fresh ? "fresh" : "stale"}"></span>Updated ${timeAgo(data.received_at)}${data.snapshot_date ? ` &middot; ${esc(formatDateLabel(data.snapshot_date))}` : ""}</div>`}
        </div>
        <div class="meta-actions">
          <input type="date" class="date-picker" id="datePicker" value="${esc(viewingDate ?? data.snapshot_date ?? "")}" max="${esc(availableDates[0] ?? "")}">
          ${viewingDate
            ? `<button class="btn-live" id="liveBtn">${svg("refresh")}Today</button>`
            : `<button class="btn-refresh" id="refreshBtn">${svg("refresh")}Refresh</button>`}
          <button class="btn-icon" id="logoutBtn" title="Log out">${svg("logout")}</button>
        </div>
      </div>
    </div>

    <div class="fade-in">
      <div class="hero">
        ${svg("porthole", "watermark")}
        <div class="eyebrow"><span class="chip">${svg("banknote")}</span>Today's Sales</div>
        <div class="figure">${peso(s.sales?.today_total)}</div>
        <div class="sub">vs yesterday ${deltaPill(salesDelta)}</div>
      </div>

      <div class="stat-grid">
        <div class="stat-card surface">
          <div class="chip blue">${svg("receipt")}</div>
          <div class="value">${s.sales?.today_orders ?? 0}</div>
          <div class="label">Orders today</div>
        </div>
        <div class="stat-card accent">
          <div class="chip" style="background:rgba(255,255,255,.2); color:#fff;">${svg("wallet")}</div>
          <div class="value">${peso(s.cashflow?.cash_on_hand)}</div>
          <div class="label">Cash on hand</div>
        </div>
        <div class="stat-card surface">
          <div class="chip emerald">${svg("users")}</div>
          <div class="value">${s.attendance?.present ?? 0}<span style="font-size:12px; font-weight:600;">/${roster.length}</span></div>
          <div class="label">Present today</div>
        </div>
        <div class="stat-card surface">
          <div class="chip sky">${svg("gauge")}</div>
          <div class="value">${s.machines?.total_loads_today ?? 0}</div>
          <div class="label">Loads today</div>
        </div>
      </div>

      <div class="detail-grid">
        <div class="stack">
          <div class="card">
            <h2 class="section">${svg("wallet", "icon-lg")}Cashflow</h2>
            <div class="cf-rows">
              <div class="item"><div class="amt" style="color:var(--emerald-600)">${peso(s.cashflow?.today_income)}</div><div class="lbl">Income today</div></div>
              <div class="item"><div class="amt" style="color:var(--red-600)">${peso(s.cashflow?.today_expense)}</div><div class="lbl">Expense today</div></div>
              <div class="item"><div class="amt">${peso(s.cashflow?.today_net)}</div><div class="lbl">Net today</div></div>
            </div>
            <div class="method-grid">
              ${["cash", "gcash", "card", "bank_transfer"].map((m) => `
                <div class="item">
                  <div class="chip sm gray">${svg("banknote")}</div>
                  <div><div class="amt">${peso(s.cashflow?.by_method?.[m])}</div><div class="lbl">${m === "bank_transfer" ? "Bank Transfer" : m[0].toUpperCase() + m.slice(1)}</div></div>
                </div>`).join("")}
            </div>
          </div>

          <div class="card">
            <h2 class="section">${svg("receipt", "icon-lg")}Expenses today${expenses.length ? ` &middot; ${expenses.length} txn${expenses.length === 1 ? "" : "s"}` : ""}</h2>
            ${expensesHtml}
          </div>

          <div class="card">
            <h2 class="section">${svg("gauge", "icon-lg")}Machines</h2>
            ${machinesHtml}
          </div>
        </div>

        <div class="card">
          <h2 class="section">${svg("users", "icon-lg")}Attendance &middot; ${s.attendance?.present ?? 0} present, ${s.attendance?.late ?? 0} late, ${s.attendance?.absent ?? 0} absent</h2>
          ${rosterHtml}
        </div>
      </div>
    </div>
  `;
  $("#logoutBtn").onclick = () => doLogout();
  $("#datePicker").onchange = (e) => { if (e.target.value) loadSnapshot(e.target.value); };
  if (!availableDatesLoaded) loadAvailableDates();

  const btn = $("#refreshBtn");
  if (btn) {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.classList.add("spinning");
      try { await loadSnapshot(); } finally {
        btn.disabled = false;
        btn.classList.remove("spinning");
      }
    };
  }
  const liveBtn = $("#liveBtn");
  if (liveBtn) liveBtn.onclick = () => loadSnapshot();
}

async function loadSnapshot(date) {
  try {
    const qs = date ? `?date=${encodeURIComponent(date)}` : "";
    const data = await api(`/v1/dashboard/snapshot${qs}`);
    navigate("/dashboard");
    viewingDate = date ?? null;
    renderDashboard(data);
  } catch {
    navigate("/login");
    renderLogin();
  }
}

async function loadAvailableDates() {
  availableDatesLoaded = true;
  try {
    const data = await api("/v1/dashboard/snapshot/dates");
    availableDates = data.dates ?? [];
    const el = $("#datePicker");
    if (el && availableDates.length) {
      el.min = availableDates[availableDates.length - 1];
      el.max = availableDates[0];
    }
  } catch {
    availableDatesLoaded = false;
  }
}

route();
setInterval(() => { if ($("#refreshBtn") && !viewingDate) loadSnapshot(); }, 60000);
</script>
</body>
</html>
